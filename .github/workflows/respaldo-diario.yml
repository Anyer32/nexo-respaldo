name: Respaldo diario Nexo

on:
  schedule:
    - cron: '0 16 * * *'   # ajustá la hora UTC según tu huso
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Node 22 LTS

      - run: npm install       # en vez de npm ci

      - run: node generar-respaldo.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESPALDO_USUARIO: ${{ secrets.RESPALDO_USUARIO }}
          RESPALDO_PASSWORD: ${{ secrets.RESPALDO_PASSWORD }}

      - name: Guardar el archivo actualizado en el repo
        run: |
          git config user.name "Respaldo automático"
          git config user.email "actions@github.com"
          git add respaldo-nexo.xlsx
          git diff --staged --quiet || git commit -m "Respaldo $(date -u +'%Y-%m-%d')"
          git push
